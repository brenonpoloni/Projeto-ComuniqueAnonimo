<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Situação 4</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #000000 0%, #0b1f3a 50%, #0d5bd1 100%);
      font-family: Arial, Helvetica, sans-serif;
    }
    .card {
      width: min(90vw, 620px);
      min-height: 420px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }
    .emoji {
      font-size: 180px;
      line-height: 1;
    }
    .legenda {
      margin-top: 10px;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    p {
      margin: 16px 0 0;
      color: #ffffff;
      font-size: clamp(1.1rem, 2vw, 1.8rem);
      line-height: 1.5;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🧤</div>
    <p>Você usou luva e não se cortou.</p>
  </div>
</body>
</html>
