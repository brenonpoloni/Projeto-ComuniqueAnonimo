<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Situação 5</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #000000 0%, #0b1f3a 50%, #0d5bd1 100%);
      font-family: Arial, Helvetica, sans-serif;
    }
    .card {
      width: min(90vw, 680px);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      padding: 40px 28px;
      text-align: center;
    }
    p {
      margin: 0;
      color: #ffffff;
      font-size: clamp(1.2rem, 2vw, 2rem);
      line-height: 1.5;
      font-weight: 600;
    }
    .emoji {
      font-size: 120px;
      margin-bottom: 12px;
      display: block;
    }
    .legenda {
      margin-top: 10px;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .alerta {
      margin-top: 18px;
      color: #ffb4b4;
      font-size: clamp(1.4rem, 2.2vw, 2.3rem);
      line-height: 1.4;
      font-weight: 700;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="emoji">🚜</span>
    <div class="legenda">Empilhadeira</div>
    <p>Você não teve responsabilidade e causou um acidente com a empilhadeira.</p>
    <div class="alerta">VOCÊ SOREU UM ACIDENTE DE EMPILHADEIRA</div>
  </div>
</body>
</html>
