<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Situação 1</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #000000 0%, #0b1f3a 50%, #0d5bd1 100%);
      font-family: Arial, Helvetica, sans-serif;
    }
    .card {
      width: min(90vw, 500px);
      min-height: 420px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }
    .emoji {
      font-size: 180px;
      line-height: 1;
    }
    .legenda {
      margin-top: 10px;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .descricao {
      margin-top: 12px;
      color: #ffffff;
      font-size: 0.95rem;
      line-height: 1.6;
      font-weight: 500;
      max-width: 360px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🚜</div>
    <div class="legenda">Empilhadeira</div>
    <div class="descricao">O uso indevido de uma empilhadeira em alta velocidade é um ato de risco tanto para o motorista quanto para os demais pedestres, em que com o aumento da velocidade pode resultar em derrapagem do equipamento, queda e atropelamento dos demais pedestres.</div>
  </div>
</body>
</html>
